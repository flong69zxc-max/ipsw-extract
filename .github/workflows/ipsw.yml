name: Extract Kernel & SPTM for iPhone 13

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: |
          V=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL -o /tmp/i.tgz "https://github.com/blacktop/ipsw/releases/download/v${V}/ipsw_${V}_linux_x86_64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/i.tgz ipsw
          ipsw version

      - name: Download IPSW
        run: |
          mkdir -p ipsw
          ipsw download ipsw \
            --device iPhone14,5 \
            --build 24A437 \
            --output ./ipsw \
            --confirm
          find ./ipsw -name '*.ipsw' -ls

      - name: Extract kernelcache from IPSW
        run: |
          IPSW=$(find ./ipsw -name '*.ipsw' -print -quit)
          mkdir -p kcache
          ipsw extract --kernel "$IPSW" --output ./kcache
          echo "=== kcache ==="
          find ./kcache -type f -ls

      - name: Extract kernel from kernelcache
        run: |
          KC=$(find ./kcache -type f -name 'kernelcache*' ! -name '*.plist' ! -name '*.json' -print -quit)
          echo "kernelcache: $KC"
          mkdir -p kernel_out
          ipsw kernel extract "$KC" --output ./kernel_out 2>&1 | tee kernel_extract.log || true
          echo "=== kernel_out ==="
          find ./kernel_out -type f -ls

      - name: Fallback — ipsw kernel dec
        run: |
          KC=$(find ./kcache -type f -name 'kernelcache*' ! -name '*.plist' ! -name '*.json' -print -quit)
          mkdir -p kernel_dec
          ipsw kernel dec "$KC" --output ./kernel_dec 2>&1 | tee kernel_dec.log || true
          echo "=== kernel_dec ==="
          find ./kernel_dec -type f -ls

      - name: Extract SPTM from IPSW
        run: |
          IPSW=$(find ./ipsw -name '*.ipsw' -print -quit)
          mkdir -p sptm_out
          ipsw extract --sptm "$IPSW" --output ./sptm_out 2>&1 | tee sptm.log || true
          ipsw extract --txm  "$IPSW" --output ./sptm_out 2>&1 | tee -a sptm.log || true
          echo "=== sptm_out ==="
          find ./sptm_out -type f -ls

      - name: Summary of all extracted files
        run: |
          echo "=== all .raw ==="
          find . -type f -name '*.raw' -ls
          echo "=== all kernel* ==="
          find . -type f -iname 'kernel*' -ls
          echo "=== all sptm* ==="
          find . -type f -iname 'sptm*' -ls
          echo "=== all txm* ==="
          find . -type f -iname 'txm*' -ls
          echo "=== top-level dirs ==="
          ls -la

      - name: Upload everything useful
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sptm-iphone13-24A437
          path: |
            kernel_out/**
            kernel_dec/**
            sptm_out/**
            kcache/**
            kernel_extract.log
            kernel_dec.log
            sptm.log
          retention-days: 30
          if-no-files-found: warn
